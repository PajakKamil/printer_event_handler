[package]
name = "printer_event_handler"
version = "1.4.0"
edition = "2024"
description = "A cross-platform printer status monitoring library for Windows and Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PajakKamil/printer_event_handler"
keywords = ["printer", "monitoring", "cups", "wmi", "cross-platform"]
categories = ["os", "api-bindings"]
# Examples have their own Cargo.toml under examples/ - prevent cargo from
# auto-discovering examples/*.rs as targets of the parent crate.
autoexamples = false

[[bin]]
name = "printer_monitor"
path = "src/main.rs"
# The CLI uses `#[tokio::main]` (multi-threaded by default), so it cannot be
# built when the `rt-multi-thread` cargo feature is disabled. Library-only
# consumers (`default-features = false`) simply skip the bin target.
required-features = ["rt-multi-thread"]

[lib]
name = "printer_event_handler"
path = "src/lib.rs"

# Cargo features:
# - `rt-multi-thread` (default): enables tokio's multi-threaded runtime.
#   The library itself only needs the `rt` feature for `tokio::spawn`. The
#   multi-threaded runtime is enabled by default to preserve the existing
#   out-of-the-box behavior and to power the `printer_monitor` binary's
#   `#[tokio::main]`. Library consumers who want a smaller runtime (e.g.
#   `current_thread`) can opt out with `default-features = false`.
[features]
default = ["rt-multi-thread"]
rt-multi-thread = ["tokio/rt-multi-thread"]
# Enables `serde::Serialize` + `Deserialize` derives on the public domain types
# (Printer, PrinterStatus, PrinterState, ErrorState, PropertyChange,
# PrinterChanges, PrinterSummary, MonitorableProperty). `serde` itself is
# already a required transitive dependency (via the `wmi` crate on Windows and
# `chrono`'s `serde` feature on every platform), so the feature only toggles
# the derives, not the dependency graph. `PrinterError` is intentionally not
# derived because `std::io::Error` is not `Serialize`.
serde = []
# Routes the library's internal log calls through the `tracing` crate instead
# of `log`. Useful for consumers already on a `tracing` subscriber - avoids
# dual-emit. Both backends accept the same format-string call sites, so
# enabling this is a drop-in replacement.
tracing = ["dep:tracing"]
# Enables an event-driven monitoring path on Windows backed by WMI's
# `__InstanceModificationEvent` notifications (via `wmi::WMIConnection`'s
# `raw_notification`). Opt-in via `MonitorBuilder::with_events(true)`. The
# polling path remains the default. Windows-only - on other platforms the
# feature is a no-op and the builder falls back to polling.
events = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "process", "fs", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7.18"
log = "0.4.29"
env_logger = "0.11.10"
tracing = { version = "0.1", optional = true }
chrono = { version = "0.4.44", features = ["serde"] }
async-trait = "0.1.89"

[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"

[dev-dependencies]
# Required by tests/integration_real_events.rs to implement the public
# `PrinterBackend` trait (`#[async_trait]`) for the scripted backend that
# drives the end-to-end change-detection tests without touching the OS.
async-trait = "0.1.89"
# Used by the serde-roundtrip tests gated on `feature = "serde"`.
serde_json = "1.0.149"

