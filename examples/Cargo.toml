[package]
name = "printer_event_handler_examples"
version = "1.4.0"
edition = "2021"
publish = false

[[bin]]
name = "basic_listing"
path = "basic_listing.rs"

[[bin]]
name = "monitor_changes"
path = "monitor_changes.rs"

[[bin]]
name = "error_handling"
path = "error_handling.rs"

[[bin]]
name = "async_patterns"
path = "async_patterns.rs"

[[bin]]
name = "property_monitoring"
path = "property_monitoring.rs"

[[bin]]
name = "cancellation_token_example"
path = "cancellation_token_example.rs"

[dependencies]
printer_event_handler = { path = ".." }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
env_logger = "0.11.8"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"  # Only needed for async_patterns example