[package]
name = "printer_event_handler_examples"
version = "2.0.0"
edition = "2024"
publish = false

[[bin]]
name = "basic_listing"
path = "basic_listing.rs"

[[bin]]
name = "monitor_changes"
path = "monitor_changes.rs"

[[bin]]
name = "error_handling"
path = "error_handling.rs"

[[bin]]
name = "async_patterns"
path = "async_patterns.rs"

[[bin]]
name = "property_monitoring"
path = "property_monitoring.rs"

[[bin]]
name = "cancellation_token_example"
path = "cancellation_token_example.rs"

[[bin]]
name = "streaming_changes"
path = "streaming_changes.rs"

[[bin]]
name = "events_demo"
path = "events_demo.rs"

[[bin]]
name = "jobs_listing"
path = "jobs_listing.rs"

[features]
# Default enables the event-driven subscription path through the parent crate
# so `events_demo` shows a real WMI / CUPS D-Bus subscription out of the box.
# Disable with `--no-default-features` (and rerun events_demo) to see the
# polling fallback the builder logs when the parent feature is off.
default = ["events"]
events = ["printer_event_handler/events"]

[dependencies]
# `events` follows the workspace feature above so the cfg checks inside
# `events_demo.rs` line up with what the parent crate actually compiled in.
# `default-features` is left implicit (= true) - the events feature is enabled
# via the explicit `[features].events` entry above, not by overriding defaults.
printer_event_handler = { path = ".." }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tokio-stream = "0.1.18"
env_logger = "0.11.10"
chrono = { version = "0.4.44", features = ["serde"] }
